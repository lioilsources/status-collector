# Builds the collector for the NAS so it needs no Go toolchain, no C compiler
# and no checkout of this repo.
#
# SQLite is modernc.org/sqlite (pure Go), so this is a plain CGO_ENABLED=0
# cross-compile — no cross toolchain, no static-linking flags, no glibc
# version to worry about on the target.
#
#   push a tag v*            → publishes a GitHub Release with both architectures
#   workflow_dispatch, no tag → builds and uploads artifacts only, publishes nothing
#   workflow_dispatch + tag   → publishes that existing tag as a Release
#
# The manual path exists because a tag pushed in the same breath as the commit
# that introduced this file did not fire the push trigger; with it, a release
# never depends on that timing.
name: Release binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish as a Release (leave empty to only build artifacts)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          go build -ldflags="-s -w" -o status-collector ./cmd/status-collector
          file status-collector

      - name: Stage tarball
        run: |
          set -euo pipefail
          stage=status-collector_linux_${{ matrix.arch }}
          mkdir -p "$stage/systemd"
          mv status-collector "$stage/"
          cp deploy/install.sh deploy/publish-snapshot.sh "$stage/"
          cp deploy/ol1n-status.service \
             deploy/ol1n-status-snapshot.service \
             deploy/ol1n-status-snapshot.timer "$stage/systemd/"
          chmod +x "$stage/install.sh" "$stage/publish-snapshot.sh"
          tar czf "$stage.tar.gz" "$stage"
          sha256sum "$stage.tar.gz" > "$stage.tar.gz.sha256"
          tar tzf "$stage.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: status-collector_linux_${{ matrix.arch }}
          path: status-collector_linux_${{ matrix.arch }}.tar.gz*
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ls -la dist
          gh release create "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "$TAG" \
            --generate-notes \
            dist/*
