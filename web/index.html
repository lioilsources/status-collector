<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ol1n — system status</title>
<!--
  Filled in at deploy time by .github/workflows/pages.yml.
  Left empty, the page falls back to its own origin (local dev, NAS-hosted copy).
  api-base      — live collector API, e.g. https://status-api.ol1n.com
  snapshot-base — directory holding status.json / comfy.json pushed by the NAS,
                  used when the live API cannot be reached.
-->
<meta name="api-base" content="">
<meta name="snapshot-base" content="">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

  :root {
    --bg:        #0a0a0b;
    --surface:   #111114;
    --border:    #1e1e24;
    --border2:   #2a2a33;
    --text:      #e2e2e8;
    --muted:     #6b6b7a;
    --accent:    #7c6af7;
    --up:        #22c55e;
    --up-dim:    #16613a;
    --down:      #ef4444;
    --down-dim:  #6b1d1d;
    --warn:      #f59e0b;
    --no-data:   #1e1e24;
    --font-mono: 'IBM Plex Mono', monospace;
    --font-sans: 'IBM Plex Sans', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { font-size: 14px; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    min-height: 100vh;
    line-height: 1.5;
  }

  /* ── Scanline overlay ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,.07) 2px,
      rgba(0,0,0,.07) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  /* ── Header ── */
  header {
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: rgba(10,10,11,.92);
    backdrop-filter: blur(8px);
    z-index: 100;
  }

  .logo {
    font-family: var(--font-mono);
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: -.02em;
    color: var(--text);
    text-decoration: none;
  }
  .logo span { color: var(--accent); }

  .header-meta {
    font-family: var(--font-mono);
    font-size: .72rem;
    color: var(--muted);
    text-align: right;
  }

  /* ── Hero status bar ── */
  .hero {
    border-bottom: 1px solid var(--border);
    padding: 28px 24px 24px;
  }

  .overall-status {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 6px;
  }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    position: relative;
  }

  .status-dot.up {
    background: var(--up);
    box-shadow: 0 0 8px var(--up);
  }
  .status-dot.up::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: var(--up);
    opacity: .2;
    animation: pulse 2s ease-in-out infinite;
  }
  .status-dot.down { background: var(--down); box-shadow: 0 0 8px var(--down); }
  .status-dot.partial { background: var(--warn); box-shadow: 0 0 8px var(--warn); }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: .2; }
    50%       { transform: scale(1.6); opacity: 0; }
  }

  .overall-label {
    font-family: var(--font-mono);
    font-size: 1.2rem;
    font-weight: 500;
  }

  .hero-sub {
    font-size: .8rem;
    color: var(--muted);
    font-family: var(--font-mono);
    padding-left: 22px;
  }

  /* ── Main layout ── */
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 24px 64px;
  }

  /* ── Group header ── */
  .group-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 36px 0 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .group-header h2 {
    font-family: var(--font-mono);
    font-size: .7rem;
    font-weight: 500;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .group-header::before {
    content: '';
    display: block;
    width: 3px;
    height: 14px;
    background: var(--accent);
    border-radius: 2px;
    flex-shrink: 0;
  }

  /* ── Endpoint row ── */
  .endpoint {
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 8px;
    overflow: hidden;
    transition: border-color .15s;
  }
  .endpoint:hover { border-color: var(--border2); }

  .endpoint-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px 10px;
  }

  .ep-name {
    font-family: var(--font-mono);
    font-size: .82rem;
    font-weight: 500;
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .ep-uptime {
    font-family: var(--font-mono);
    font-size: .72rem;
    color: var(--muted);
    white-space: nowrap;
  }

  .ep-badge {
    font-family: var(--font-mono);
    font-size: .65rem;
    font-weight: 600;
    letter-spacing: .05em;
    padding: 2px 7px;
    border-radius: 3px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .ep-badge.up   { background: rgba(34,197,94,.12); color: var(--up); border: 1px solid rgba(34,197,94,.2); }
  .ep-badge.down { background: rgba(239,68,68,.12);  color: var(--down); border: 1px solid rgba(239,68,68,.2); }
  .ep-badge.unknown { background: rgba(107,107,122,.1); color: var(--muted); border: 1px solid var(--border); }

  /* ── Timeline grid ── */
  .timeline {
    padding: 0 16px 12px;
  }

  .timeline-labels {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: .62rem;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .buckets {
    display: flex;
    gap: 1px;
    height: 28px;
    align-items: stretch;
  }

  .bucket {
    flex: 1;
    border-radius: 2px;
    cursor: pointer;
    transition: filter .1s, transform .1s;
    position: relative;
  }
  .bucket:hover { filter: brightness(1.5); transform: scaleY(1.1); z-index: 1; }

  .bucket.up        { background: var(--up-dim); }
  .bucket.up.full   { background: var(--up); }
  .bucket.up.high   { background: #18a84e; }
  .bucket.down      { background: var(--down-dim); }
  .bucket.no-data   { background: var(--no-data); }
  .bucket.partial   { background: var(--warn); opacity: .6; }

  /* ── Tooltip ── */
  .tooltip {
    position: fixed;
    background: #1a1a22;
    border: 1px solid var(--border2);
    border-radius: 4px;
    padding: 8px 10px;
    font-family: var(--font-mono);
    font-size: .7rem;
    pointer-events: none;
    z-index: 500;
    white-space: nowrap;
    display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,.6);
  }
  .tooltip.visible { display: block; }
  .tooltip .t-time  { color: var(--muted); margin-bottom: 3px; }
  .tooltip .t-avail { font-weight: 600; }
  .tooltip .t-avail.up   { color: var(--up); }
  .tooltip .t-avail.down { color: var(--down); }
  .tooltip .t-avail.partial { color: var(--warn); }
  .tooltip .t-lat   { color: var(--muted); margin-top: 2px; font-size: .65rem; }
  .tooltip .t-lat .dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 2px;
    margin-right: 5px;
    vertical-align: 0;
  }

  /* ── Latency row ── */
  .ep-latency {
    font-family: var(--font-mono);
    font-size: .7rem;
    color: var(--muted);
    padding: 0 16px 4px;
  }
  .ep-latency span { color: var(--text); }

  /* ── Source / staleness chip ── */
  .chip {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: .6rem;
    letter-spacing: .04em;
    padding: 1px 6px;
    border-radius: 3px;
    border: 1px solid var(--border2);
    color: var(--muted);
    margin-right: 6px;
    vertical-align: 1px;
  }
  .chip.warn {
    color: var(--warn);
    border-color: rgba(245,158,11,.35);
    background: rgba(245,158,11,.1);
  }
  .chip[hidden] { display: none; }

  /* ── KPI tiles ── */
  .kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
    gap: 8px;
    margin: 12px 0;
  }
  .kpi {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    background: var(--surface);
  }
  .kpi .k-label {
    font-family: var(--font-mono);
    font-size: .6rem;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .kpi .k-value {
    font-family: var(--font-mono);
    font-size: 1.15rem;
    font-weight: 600;
    margin-top: 3px;
    line-height: 1.2;
  }
  .kpi .k-sub {
    font-family: var(--font-mono);
    font-size: .6rem;
    color: var(--muted);
    margin-top: 1px;
  }
  .kpi.hot .k-value { color: var(--warn); }

  /* ── Gauge series (queue depth, VRAM) ── */
  .series {
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 8px;
    padding: 12px 16px;
    animation: fadeUp .3s ease both;
  }
  .series-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 8px;
  }
  .series-title {
    font-family: var(--font-mono);
    font-size: .82rem;
    font-weight: 500;
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .series-now {
    font-family: var(--font-mono);
    font-size: .72rem;
    color: var(--muted);
    white-space: nowrap;
  }

  /* Series palette — validated against the #111114 chart surface for the
     OKLCH dark band, chroma floor, CVD separation and contrast. Deliberately
     avoids the up/down/warn hues, which are reserved for status. */
  :root {
    --series-1: #7c6af7;
    --series-2: #d55181;
    --series-3: #1f9fb8;
    --series-4: #c98500;
  }

  .chart { display: block; width: 100%; height: auto; overflow: hidden; }
  .chart .grid-line { stroke: var(--border); stroke-width: 1; }
  .chart .axis-text {
    fill: var(--muted);
    font-family: var(--font-mono);
    font-size: 11px;
  }
  .chart .series-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .series-area { stroke: none; opacity: .16; }
  .chart .series-label {
    font-family: var(--font-mono);
    font-size: 11px;
    fill: var(--text);
  }
  .chart .crosshair { stroke: var(--border2); stroke-width: 1; visibility: hidden; }
  .chart .crosshair-dot { stroke: var(--surface); stroke-width: 2; visibility: hidden; }
  .chart .hit { fill: transparent; }

  .chart-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    font-family: var(--font-mono);
    font-size: .65rem;
    color: var(--muted);
    margin-top: 6px;
  }
  .chart-legend i {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 2px;
    margin-right: 5px;
    vertical-align: -1px;
  }

  /* Per-endpoint latency sparkline */
  .spark-wrap {
    padding: 2px 16px 8px;
  }
  .spark-label {
    font-family: var(--font-mono);
    font-size: .62rem;
    color: var(--muted);
    margin-bottom: 2px;
  }

  /* ── Daily throughput bars ── */
  .daybars {
    display: flex;
    gap: 2px;
    align-items: flex-end;
    height: 72px;
    margin-top: 4px;
  }
  .daybar {
    flex: 1;
    min-width: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    cursor: pointer;
  }
  .daybar-fill {
    background: var(--accent);
    border-radius: 2px 2px 0 0;
    min-height: 1px;
    transition: filter .1s;
  }
  .daybar:hover .daybar-fill { filter: brightness(1.4); }
  .daybar-fill.empty { background: var(--no-data); }
  .daybar-fail {
    height: 3px;
    background: var(--down);
    border-radius: 0 0 2px 2px;
  }

  /* ── Loading / error ── */
  .state-msg {
    text-align: center;
    padding: 80px 24px;
    font-family: var(--font-mono);
    color: var(--muted);
    font-size: .85rem;
  }
  .state-msg .big { font-size: 2rem; margin-bottom: 12px; }

  /* ── Footer ── */
  footer {
    border-top: 1px solid var(--border);
    padding: 20px 24px;
    font-family: var(--font-mono);
    font-size: .68rem;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 960px;
    margin: 0 auto;
  }

  /* ── Spinner ── */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--border2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    display: inline-block;
    vertical-align: middle;
    margin-right: 6px;
  }

  /* ── Narrow screens ──
     A status page is mostly read on a phone. SVG scales with its viewBox, so
     chart text has to be re-sized in user units to stay legible once the whole
     drawing is scaled down. */
  @media (max-width: 680px) {
    html { font-size: 13px; }

    header { padding: 0 14px; height: auto; min-height: 56px; }
    .header-meta { font-size: .62rem; }

    .hero { padding: 20px 14px 18px; }
    .overall-label { font-size: 1rem; }
    .hero-sub { padding-left: 0; font-size: .7rem; }

    main { padding: 20px 12px 48px; }
    footer { padding: 16px 14px; flex-direction: column; gap: 6px; align-items: flex-start; }

    .endpoint-header { flex-wrap: wrap; gap: 6px 10px; padding: 10px 12px 8px; }
    .ep-name { flex: 1 0 100%; }
    .timeline, .ep-latency { padding-left: 12px; padding-right: 12px; }
    .spark-wrap { padding-left: 12px; padding-right: 12px; }
    .series { padding: 10px 12px; }

    .kpis { grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 6px; }
    .kpi { padding: 8px 10px; }
    .kpi .k-value { font-size: 1rem; }

    .chart .axis-text { font-size: 21px; }
    .chart .series-label { font-size: 21px; }
    .chart-legend { font-size: .62rem; }

    .daybars { height: 56px; }
  }

  /* ── Fade-in ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .endpoint {
    animation: fadeUp .3s ease both;
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="/">ol1n<span>.</span>status</a>
  <div class="header-meta">
    <div><span class="chip" id="source-chip" hidden></span><span id="last-updated">načítám…</span></div>
    <div>llm.ol1n.com</div>
  </div>
</header>

<div class="hero">
  <div class="overall-status">
    <div class="status-dot" id="overall-dot"></div>
    <div class="overall-label" id="overall-label">Zjišťuji stav…</div>
  </div>
  <div class="hero-sub" id="overall-sub"></div>
</div>

<main id="main">
  <div class="state-msg">
    <div><span class="spinner"></span> Načítám data…</div>
  </div>
</main>

<footer>
  <div>Interval kontroly: 1 hodina · Retenace dat: 30 dní</div>
  <div id="footer-ts"></div>
</footer>

<div class="tooltip" id="tooltip">
  <div class="t-time" id="tt-time"></div>
  <div class="t-avail" id="tt-avail"></div>
  <div class="t-lat"   id="tt-lat"></div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────
// Both values are injected at deploy time (see the <meta> tags in <head>).
// Empty api-base means "same origin", which is what local dev and the old
// NAS-hosted deployment want.
const meta = n => document.querySelector(`meta[name="${n}"]`)?.content?.trim() || '';

const API_BASE      = meta('api-base') || window.location.origin;
const SNAPSHOT_BASE = meta('snapshot-base');

const DAYS  = 30;
const HOURS = DAYS * 24;      // number of hourly buckets to render
const LIVE_TIMEOUT_MS = 6000; // give up on the collector quickly, then fall back

// ── Helpers ───────────────────────────────────────────────────────────────
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function fmtMs(ms) {
  if (!ms || ms < 0) return '0 s';
  if (ms < 1000)     return `${Math.round(ms)} ms`;
  if (ms < 60000)    return `${(ms / 1000).toFixed(1)} s`;
  if (ms < 3600000)  return `${Math.round(ms / 60000)} min`;
  return `${(ms / 3600000).toFixed(1)} h`;
}

function fmtAgo(date) {
  const sec = Math.max(0, (Date.now() - date.getTime()) / 1000);
  if (sec < 90)    return `před ${Math.round(sec)} s`;
  if (sec < 5400)  return `před ${Math.round(sec / 60)} min`;
  if (sec < 172800) return `před ${Math.round(sec / 3600)} h`;
  return `před ${Math.round(sec / 86400)} dny`;
}

function fmtBytes(b) {
  if (!b) return '–';
  const gb = b / 1073741824;
  return gb >= 1 ? `${gb.toFixed(1)} GB` : `${Math.round(b / 1048576)} MB`;
}

function dayKey(d) {
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
}

// ── Tooltip ───────────────────────────────────────────────────────────────
const tooltip = document.getElementById('tooltip');
const ttTime  = document.getElementById('tt-time');
const ttAvail = document.getElementById('tt-avail');
const ttLat   = document.getElementById('tt-lat');

document.addEventListener('mousemove', e => {
  const pad = 12;
  let x = e.clientX + pad;
  let y = e.clientY + pad;
  const tw = tooltip.offsetWidth + 8;
  const th = tooltip.offsetHeight + 8;
  if (x + tw > window.innerWidth)  x = e.clientX - tw;
  if (y + th > window.innerHeight) y = e.clientY - th;
  tooltip.style.left = x + 'px';
  tooltip.style.top  = y + 'px';
});

function showTip(time, main, sub, cls) {
  ttTime.textContent  = time;
  ttAvail.textContent = main;
  ttAvail.className   = 't-avail ' + (cls || '');
  ttLat.innerHTML     = sub || '';
  tooltip.classList.add('visible');
}

function hideTooltip() {
  tooltip.classList.remove('visible');
}

function hourLabel(ts) {
  return new Date(ts).toLocaleString('cs-CZ', {
    day: '2-digit', month: '2-digit', year: 'numeric',
    hour: '2-digit', minute: '2-digit'
  });
}

function rangeLabel(bucket) {
  if (!bucket.hour_end) return hourLabel(bucket.hour);
  const from = new Date(bucket.hour);
  const to = new Date(bucket.hour_end);
  const sameDay = from.toDateString() === to.toDateString();
  const hm = d => d.toLocaleString('cs-CZ', { hour: '2-digit', minute: '2-digit' });
  return sameDay
    ? `${hourLabel(bucket.hour)} – ${hm(to)}`
    : `${hourLabel(bucket.hour)} – ${hourLabel(bucket.hour_end)}`;
}

function showBucketTip(bucket) {
  if (bucket.avail === -1) {
    showTip(rangeLabel(bucket), 'Žádná data', '', 'partial');
    return;
  }
  const pct = (bucket.avail * 100).toFixed(1);
  const cls = bucket.avail >= .99 ? 'up' : bucket.avail > 0 ? 'partial' : 'down';
  const checks = bucket.down > 0 ? ` (${bucket.down} z ${bucket.up + bucket.down} selhalo)` : '';
  const lat = bucket.avg_lat_ms > 0 ? `Ø latence: ${Math.round(bucket.avg_lat_ms)} ms${checks}` : checks.trim();
  showTip(rangeLabel(bucket), `Dostupnost: ${pct}%`, lat, cls);
}

// ── Bucket grid helpers ───────────────────────────────────────────────────
const SLOT_MS = 3600000;

function buildBucketMap(points) {
  const map = {};
  for (const b of points) {
    map[Math.floor(new Date(b.hour).getTime() / SLOT_MS) * SLOT_MS] = b;
  }
  return map;
}

function bucketClass(b) {
  if (!b || b.avail === -1) return 'no-data';
  if (b.avail >= .999) return 'up full';
  if (b.avail >= .95)  return 'up high';
  if (b.avail >= .5)   return 'up partial';
  if (b.avail > 0)     return 'down partial';
  return 'down';
}

// ── Charts ────────────────────────────────────────────────────────────────
// Magnitude over time is a line, not a coloured cell — a colour ramp can only
// show a few buckets, and reading a number off it is guesswork. The cell grid
// stays for availability, where the data really is a handful of states.
const SVG_NS = 'http://www.w3.org/2000/svg';

// Validated for the #111114 chart surface (see the --series-* CSS custom
// properties). Assigned in fixed order and never cycled.
const SERIES = ['#7c6af7', '#d55181', '#1f9fb8', '#c98500'];

const CHART_W = 1000;
// Right padding becomes a label gutter when a chart carries direct labels, so
// they never sit on top of the data they are naming.
const PAD = { l: 52, r: 16, t: 12, b: 22 };
const LABEL_GUTTER = 104;

function svgEl(name, attrs) {
  const n = document.createElementNS(SVG_NS, name);
  for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v);
  return n;
}

// niceMax rounds the axis top up to a readable step so the gridline labels are
// round numbers rather than whatever the peak sample happened to be.
function niceMax(v) {
  if (!isFinite(v) || v <= 0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  for (const step of [1, 2, 2.5, 5, 10]) {
    if (v <= step * mag) return step * mag;
  }
  return 10 * mag;
}

// Align a series onto the shared 720-hour axis, leaving null where the
// collector has no sample. Nulls break the line instead of being interpolated
// across, so a gap in the data never looks like a measurement.
function alignHourly(points, pick) {
  const map = buildBucketMap(points || []);
  const nowSlot = Math.floor(Date.now() / SLOT_MS) * SLOT_MS;
  const out = [];
  for (let i = HOURS - 1; i >= 0; i--) {
    const slot = nowSlot - i * SLOT_MS;
    const b = map[slot];
    out.push({ x: slot, y: b ? pick(b) : null });
  }
  return out;
}

function alignDaily(days, pick) {
  const byDay = {};
  for (const d of days || []) byDay[d.day] = d;
  const out = [];
  const now = Date.now();
  for (let i = DAYS - 1; i >= 0; i--) {
    const d = new Date(now - i * 86400000);
    const key = dayKey(d);
    const stat = byDay[key];
    out.push({
      x: Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()),
      y: stat ? pick(stat) : null,
      key, stat,
    });
  }
  return out;
}

function hasData(series) {
  return series.some(s => s.points.some(p => p.y !== null && p.y !== undefined));
}

// lineChart renders one or more series that share an x axis and a unit.
// Series never get their own y scale — two units means two charts.
function lineChart({ series, yMax, yFormat, xLabels, height = 176, area = false }) {
  const H = height;
  const showX = xLabels !== false;
  // On a phone the label gutter is too narrow for the enlarged type, so the
  // legend carries identity on its own rather than letting labels run off the
  // edge of the drawing.
  const direct = series.length > 1 && window.innerWidth > 680;
  const padR = direct ? LABEL_GUTTER : PAD.r;
  const padB = showX ? PAD.b : 6;
  const pw = CHART_W - PAD.l - padR;
  const ph = H - PAD.t - padB;

  const xs = series[0].points.map(p => p.x);
  const x0 = xs[0], x1 = xs[xs.length - 1];
  let peak = 0;
  for (const s of series) for (const p of s.points) if (p.y > peak) peak = p.y;
  const top = yMax || niceMax(peak);

  const px = t => PAD.l + (x1 === x0 ? 0 : (t - x0) / (x1 - x0) * pw);
  const py = v => PAD.t + ph - (Math.min(v, top) / top) * ph;

  const svg = svgEl('svg', {
    class: 'chart',
    viewBox: `0 0 ${CHART_W} ${H}`,
    preserveAspectRatio: 'xMidYMid meet',
    role: 'img',
  });

  // Recessive grid + y labels
  for (const frac of [0, 0.5, 1]) {
    const v = top * frac;
    const y = py(v);
    svg.appendChild(svgEl('line', { class: 'grid-line', x1: PAD.l, x2: CHART_W - padR, y1: y, y2: y }));
    const label = svgEl('text', { class: 'axis-text', x: PAD.l - 8, y: y + 4, 'text-anchor': 'end' });
    label.textContent = yFormat ? yFormat(v) : String(Math.round(v * 10) / 10);
    svg.appendChild(label);
  }

  // x labels — suppressed on the endpoint sparkline, which sits directly under
  // a bucket grid that already carries the same axis.
  if (showX) {
    const labels = Array.isArray(xLabels) ? xLabels : ['30 dní', '15 dní', 'dnes'];
    labels.forEach((text, i) => {
      const anchor = i === 0 ? 'start' : i === labels.length - 1 ? 'end' : 'middle';
      const x = PAD.l + (pw * i) / (labels.length - 1);
      const t = svgEl('text', { class: 'axis-text', x, y: H - 6, 'text-anchor': anchor });
      t.textContent = text;
      svg.appendChild(t);
    });
  }

  // Contiguous runs, so a gap in the data is a gap in the line.
  const runsOf = pts => {
    const runs = [];
    let cur = [];
    for (const p of pts) {
      if (p.y === null || p.y === undefined) {
        if (cur.length) runs.push(cur);
        cur = [];
      } else cur.push(p);
    }
    if (cur.length) runs.push(cur);
    return runs;
  };

  series.forEach((s, i) => {
    const colour = s.color || SERIES[i % SERIES.length];
    for (const run of runsOf(s.points)) {
      const d = run.map((p, j) => `${j ? 'L' : 'M'}${px(p.x).toFixed(1)} ${py(p.y).toFixed(1)}`).join(' ');
      if (area || s.area) {
        const base = PAD.t + ph;
        svg.appendChild(svgEl('path', {
          class: 'series-area', fill: colour,
          d: `${d} L${px(run[run.length - 1].x).toFixed(1)} ${base} L${px(run[0].x).toFixed(1)} ${base} Z`,
        }));
      }
      if (!s.areaOnly) {
        svg.appendChild(svgEl('path', { class: 'series-line', stroke: colour, d }));
      }
    }
  });

  // Direct labels at the last known value (<= 4 series), nudged apart so two
  // converging lines do not stack their labels on top of each other.
  if (direct) {
    const placed = [];
    series.forEach((s, i) => {
      const last = [...s.points].reverse().find(p => p.y !== null && p.y !== undefined);
      if (!last) return;
      let y = Math.max(PAD.t + 8, py(last.y));
      while (placed.some(p => Math.abs(p - y) < 14)) y += 14;
      placed.push(y);
      const t = svgEl('text', {
        class: 'series-label', x: CHART_W - padR + 8, y: y + 4,
        'text-anchor': 'start', fill: s.color || SERIES[i % SERIES.length],
      });
      t.textContent = s.label;
      svg.appendChild(t);
    });
  }

  // Hover layer: one crosshair snapped to the nearest sample, all series read
  // at once so they can actually be compared at that instant.
  const cross = svgEl('line', { class: 'crosshair', y1: PAD.t, y2: PAD.t + ph, x1: 0, x2: 0 });
  svg.appendChild(cross);
  const dots = series.map((s, i) => {
    const d = svgEl('circle', {
      class: 'crosshair-dot', r: 4,
      fill: s.color || SERIES[i % SERIES.length],
    });
    svg.appendChild(d);
    return d;
  });

  const hit = svgEl('rect', { class: 'hit', x: PAD.l, y: PAD.t, width: pw, height: ph });
  svg.appendChild(hit);

  hit.addEventListener('mousemove', ev => {
    const box = svg.getBoundingClientRect();
    const vx = (ev.clientX - box.left) / box.width * CHART_W;
    const frac = Math.max(0, Math.min(1, (vx - PAD.l) / pw));
    const idx = Math.round(frac * (xs.length - 1));

    cross.setAttribute('x1', px(xs[idx]));
    cross.setAttribute('x2', px(xs[idx]));
    cross.style.visibility = 'visible';

    const rows = [];
    series.forEach((s, i) => {
      const p = s.points[idx];
      const dot = dots[i];
      if (!p || p.y === null || p.y === undefined) {
        dot.style.visibility = 'hidden';
        return;
      }
      dot.setAttribute('cx', px(p.x));
      dot.setAttribute('cy', py(p.y));
      dot.style.visibility = 'visible';
      const colour = s.color || SERIES[i % SERIES.length];
      // Mirror the legend: a band's swatch is faded, a line's is solid, so two
      // series sharing a hue stay distinguishable here too.
      const swatch = s.areaOnly ? `background:${colour};opacity:.28` : `background:${colour}`;
      rows.push(`<span class="dot" style="${swatch}"></span>${esc(s.label)}: ` +
                `${esc(yFormat ? yFormat(p.y) : String(p.y))}`);
    });

    const when = series[0].points[idx];
    const title = when.key || hourLabel(xs[idx]);
    if (!rows.length) {
      showTip(title, 'Žádná data', '', 'partial');
    } else {
      showTip(title, '', rows.join('<br>'), '');
      ttAvail.style.display = 'none';
    }
  });

  hit.addEventListener('mouseleave', () => {
    cross.style.visibility = 'hidden';
    dots.forEach(d => (d.style.visibility = 'hidden'));
    ttAvail.style.display = '';
    hideTooltip();
  });

  return svg;
}

function legendMarkup(series) {
  return `<div class="chart-legend">` + series.map((s, i) => {
    const colour = s.color || SERIES[i % SERIES.length];
    // A band and a line can share a hue because their mark differs; the legend
    // swatch has to show that difference rather than repeat the same chip.
    const style = s.areaOnly
      ? `background:${colour};opacity:.28`
      : `background:${colour}`;
    return `<span><i style="${style}"></i>${esc(s.label)}</span>`;
  }).join('') + `</div>`;
}

// chartCard wraps a chart in the same shell the endpoint rows use.
function chartCard(main, title, right, series, opts) {
  const card = document.createElement('div');
  card.className = 'series';
  card.innerHTML = `
    <div class="series-head">
      <div class="series-title">${esc(title)}</div>
      <div class="series-now">${esc(right || '')}</div>
    </div>`;
  if (!hasData(series)) {
    card.innerHTML += '<div class="ep-latency" style="padding:8px 0 0">zatím žádná data</div>';
    main.appendChild(card);
    return card;
  }
  card.appendChild(lineChart({ series, ...opts }));
  if (series.length > 1) card.insertAdjacentHTML('beforeend', legendMarkup(series));
  main.appendChild(card);
  return card;
}

// cellsFor picks how many cells fit the container. One cell per hour needs
// ~1440px just for the 1px gaps, so on anything narrower the hours are grouped
// — otherwise the row overflows the viewport and the page scrolls sideways.
const MIN_CELL_PX = 3;

function cellsFor(container) {
  const width = container.clientWidth || 900;
  const target = Math.max(30, Math.min(HOURS, Math.floor(width / MIN_CELL_PX)));
  const groupSize = Math.max(1, Math.ceil(HOURS / target));
  return { groupSize, count: Math.ceil(HOURS / groupSize) };
}

// mergeBuckets folds consecutive hourly buckets into one cell. Availability is
// recomputed from the raw counts rather than averaged, so a group holding one
// bad hour out of six reads as 83%, not as a smoothed-away blip.
function mergeBuckets(slots, map) {
  let up = 0, down = 0, latSum = 0, latN = 0, any = false;
  for (const slot of slots) {
    const b = map[slot];
    if (!b) continue;
    any = true;
    up += b.up || 0;
    down += b.down || 0;
    if (b.avg_lat_ms > 0) { latSum += b.avg_lat_ms; latN++; }
  }
  if (!any) return null;
  const total = up + down;
  return {
    hour: new Date(slots[0]).toISOString(),
    hour_end: new Date(slots[slots.length - 1] + SLOT_MS).toISOString(),
    up, down,
    avail: total > 0 ? up / total : -1,
    avg_lat_ms: latN ? latSum / latN : 0,
  };
}

// renderGrid lays out one row of cells ending at the current hour, so every
// grid on the page shares one time axis regardless of how sparse its data is.
function renderGrid(container, points, describe, classify) {
  container.innerHTML = '';
  const map = buildBucketMap(points || []);
  const nowSlot = Math.floor(Date.now() / SLOT_MS) * SLOT_MS;
  const { groupSize, count } = cellsFor(container);
  const frag = document.createDocumentFragment();

  for (let c = count - 1; c >= 0; c--) {
    const slots = [];
    for (let j = groupSize - 1; j >= 0; j--) {
      const idx = c * groupSize + j;
      if (idx < HOURS) slots.unshift(nowSlot - idx * SLOT_MS);
    }
    if (!slots.length) continue;
    const b = groupSize === 1 ? (map[slots[0]] || null) : mergeBuckets(slots, map);
    const cell = document.createElement('div');
    cell.className = 'bucket ' + classify(b);
    cell.addEventListener('mouseenter', () => describe(b, slots[0], slots[slots.length - 1]));
    cell.addEventListener('mouseleave', hideTooltip);
    frag.appendChild(cell);
  }
  container.appendChild(frag);
}

function timelineMarkup(inner) {
  return `
    <div class="timeline-labels">
      <span>30 dní</span>
      <span>15 dní</span>
      <span>dnes</span>
    </div>
    <div class="buckets">${inner || ''}</div>`;
}

// ── Render: availability ──────────────────────────────────────────────────
function renderStatus(data, main) {
  const endpointsUp   = data.endpoints.filter(e => e.current?.up).length;
  const endpointsDown = data.endpoints.filter(e => e.current && !e.current.up).length;
  const dot   = document.getElementById('overall-dot');
  const label = document.getElementById('overall-label');
  const sub   = document.getElementById('overall-sub');

  if (endpointsDown === 0) {
    dot.className = 'status-dot up';
    label.textContent = 'Všechny systémy fungují';
    sub.textContent = `${endpointsUp} z ${data.endpoints.length} endpointů je dostupných`;
  } else if (endpointsUp === 0) {
    dot.className = 'status-dot down';
    label.textContent = 'Systémový výpadek';
    sub.textContent = `${endpointsDown} endpointů je nedostupných`;
  } else {
    dot.className = 'status-dot partial';
    label.textContent = 'Částečný výpadek';
    sub.textContent = `${endpointsDown} z ${data.endpoints.length} endpointů nefunguje`;
  }

  const groups = {};
  for (const ep of data.endpoints) {
    (groups[ep.group] ||= []).push(ep);
  }

  let epIdx = 0;
  for (const [groupName, eps] of Object.entries(groups)) {
    const gh = document.createElement('div');
    gh.className = 'group-header';
    gh.innerHTML = `<h2>${esc(groupName)}</h2>`;
    main.appendChild(gh);

    for (const ep of eps) {
      const card = document.createElement('div');
      card.className = 'endpoint';
      card.style.animationDelay = (epIdx * 40) + 'ms';

      const badge = ep.current
        ? (ep.current.up ? '<span class="ep-badge up">online</span>'
                         : '<span class="ep-badge down">offline</span>')
        : '<span class="ep-badge unknown">–</span>';
      const uptime = ep.uptime_30d > 0 ? `${ep.uptime_30d.toFixed(2)}%` : '–';
      const latency = ep.current?.latency_ms
        ? `<div class="ep-latency">latence: <span>${ep.current.latency_ms} ms</span> · status: <span>${ep.current.status_code || '–'}</span></div>`
        : '';
      const latPoints = alignHourly(ep.buckets, b => (b.avg_lat_ms > 0 ? b.avg_lat_ms : null));

      card.innerHTML = `
        <div class="endpoint-header">
          <div class="ep-name">${esc(ep.name)}</div>
          <div class="ep-uptime">${uptime} za 30 dní</div>
          ${badge}
        </div>
        ${latency}
        <div class="timeline">${timelineMarkup()}</div>
        <div class="spark-wrap" hidden>
          <div class="spark-label">latence za 30 dní</div>
        </div>
      `;
      main.appendChild(card);

      // The bucket grid answers "was it up"; the sparkline answers "was it
      // slow" — the latency number in the header is a single sample.
      const sparkWrap = card.querySelector('.spark-wrap');
      if (latPoints.some(p => p.y !== null)) {
        sparkWrap.hidden = false;
        sparkWrap.appendChild(lineChart({
          series: [{ label: 'latence', color: SERIES[0], points: latPoints, area: true }],
          yFormat: v => `${Math.round(v)} ms`,
          height: 76,
          xLabels: false,
        }));
      }

      renderGrid(
        card.querySelector('.buckets'),
        ep.buckets,
        (b, from, to) => showBucketTip(b || {
          hour: new Date(from).toISOString(),
          hour_end: from === to ? null : new Date(to + SLOT_MS).toISOString(),
          avail: -1, avg_lat_ms: 0, up: 0, down: 0,
        }),
        bucketClass
      );
      epIdx++;
    }
  }
}

// ── Render: ComfyUI ───────────────────────────────────────────────────────
function kpi(label, value, sub, hot) {
  return `
    <div class="kpi${hot ? ' hot' : ''}">
      <div class="k-label">${esc(label)}</div>
      <div class="k-value">${esc(value)}</div>
      <div class="k-sub">${esc(sub || '')}</div>
    </div>`;
}

function renderComfy(comfy, main) {
  if (!comfy || !comfy.enabled) return;

  const now = comfy.now || {};
  const t   = comfy.totals || {};

  const gh = document.createElement('div');
  gh.className = 'group-header';
  gh.innerHTML = '<h2>ComfyUI · metriky</h2>';
  main.appendChild(gh);

  // KPI row
  const tiles = document.createElement('div');
  tiles.className = 'kpis';

  const queueSub = now.reachable
    ? `${now.queue_running || 0} běží · ${now.queue_pending || 0} čeká`
    : 'ComfyUI nedostupné';
  const vram = (now.vram || [])[0];
  const waitNote = t.wait_estimated ? 'odhad z fronty' : 'p50 ' + fmtMs(t.wait_p50_ms);

  tiles.innerHTML = [
    kpi('fronta teď', now.reachable ? String(now.queue_depth ?? 0) : '–', queueSub,
        (now.queue_depth || 0) >= 5),
    kpi('obrázků dnes', String(t.images_today || 0), `${t.images || 0} za 30 dní`),
    kpi('čekání p95', fmtMs(t.wait_p95_ms), waitNote),
    kpi('běh jobu p95', fmtMs(t.exec_p95_ms),
        `p50 ${fmtMs(t.exec_p50_ms)}${t.cache_hit_ratio ? ` · cache ${Math.round(t.cache_hit_ratio * 100)}%` : ''}`),
    vram
      ? kpi('VRAM', `${vram.used_pct}%`, `${fmtBytes(vram.total_bytes)} · ${vram.label}`, vram.used_pct >= 90)
      : kpi('VRAM', '–', 'bez dat'),
    kpi('chybné joby', String(t.failed || 0),
        `z ${t.jobs || 0} za 30 dní${t.cancelled ? ` · ${t.cancelled} zrušeno` : ''}`, (t.failed || 0) > 0),
  ].join('');
  main.appendChild(tiles);

  // Queue depth: the hourly peak as a band, the hourly mean as a line. Same
  // measure, same unit, so they belong on one axis.
  chartCard(main, 'Hloubka fronty',
    now.reachable ? `teď ${now.queue_depth ?? 0}` : 'nedostupné',
    [
      { label: 'max za hodinu', color: SERIES[0], areaOnly: true, area: true,
        points: alignHourly(comfy.queue_depth, b => b.max) },
      { label: 'Ø za hodinu', color: SERIES[0],
        points: alignHourly(comfy.queue_depth, b => b.avg) },
    ],
    { yFormat: v => String(Math.round(v)) });

  // VRAM and system RAM share a unit and a 0-100 scale, so one chart with a
  // legend beats two charts the eye has to reconcile.
  const memSeries = [];
  for (const dev of comfy.vram_used_pct || []) {
    memSeries.push({
      label: `VRAM ${dev.label}`,
      points: alignHourly(dev.points, b => b.avg),
    });
  }
  if ((comfy.ram_used_pct || []).length) {
    memSeries.push({ label: 'RAM', points: alignHourly(comfy.ram_used_pct, b => b.avg) });
  }
  if (memSeries.length) {
    const vramNow = (now.vram || [])[0];
    chartCard(main, 'Využití paměti',
      vramNow ? `VRAM teď ${vramNow.used_pct}%` : '',
      memSeries,
      { yMax: 100, yFormat: v => `${Math.round(v)} %` });
  }

  // Latency of the jobs themselves, per day.
  chartCard(main, 'Doba běhu jobu', `p95 ${fmtMs(t.exec_p95_ms)}`, [
    { label: 'p50', points: alignDaily(comfy.days, d => d.exec_p50_ms) },
    { label: 'p95', points: alignDaily(comfy.days, d => d.exec_p95_ms) },
  ], { yFormat: fmtMs });

  chartCard(main, 'Čekání ve frontě',
    t.wait_estimated ? 'odhad z pozorování fronty' : `p95 ${fmtMs(t.wait_p95_ms)}`, [
      { label: 'p50', points: alignDaily(comfy.days, d => d.wait_p50_ms) },
      { label: 'p95', points: alignDaily(comfy.days, d => d.wait_p95_ms) },
    ], { yFormat: fmtMs });

  // Daily throughput
  const byDay = {};
  for (const d of comfy.days || []) byDay[d.day] = d;
  const peak = Math.max(1, ...(comfy.days || []).map(d => d.images));

  const barsCard = document.createElement('div');
  barsCard.className = 'series';
  barsCard.innerHTML = `
    <div class="series-head">
      <div class="series-title">Zpracované obrázky za den</div>
      <div class="series-now">max ${peak}/den</div>
    </div>
    <div class="daybars"></div>
    <div class="timeline-labels" style="margin-top:4px"><span>30 dní</span><span>dnes</span></div>`;
  main.appendChild(barsCard);

  const barsEl = barsCard.querySelector('.daybars');
  const todayUTC = new Date();
  for (let i = DAYS - 1; i >= 0; i--) {
    const d = new Date(todayUTC.getTime() - i * 86400000);
    const key = dayKey(d);
    const stat = byDay[key];
    const images = stat?.images || 0;

    const bar = document.createElement('div');
    bar.className = 'daybar';
    const h = images > 0 ? Math.max(4, Math.round(images / peak * 100)) : 2;
    bar.innerHTML = `<div class="daybar-fill${images ? '' : ' empty'}" style="height:${h}%"></div>` +
                    (stat?.failed ? '<div class="daybar-fail"></div>' : '');

    bar.addEventListener('mouseenter', () => {
      if (!stat) { showTip(key, 'Žádná data', '', 'partial'); return; }
      showTip(key, `${stat.images} obrázků · ${stat.jobs} jobů`,
        `ok ${stat.ok} · chyb ${stat.failed} · zrušeno ${stat.cancelled}<br>` +
        `běh p50 ${fmtMs(stat.exec_p50_ms)} · p95 ${fmtMs(stat.exec_p95_ms)}<br>` +
        `čekání p95 ${fmtMs(stat.wait_p95_ms)}${stat.wait_estimated ? ' (odhad)' : ''}`,
        stat.failed ? 'partial' : 'up');
    });
    bar.addEventListener('mouseleave', hideTooltip);
    barsEl.appendChild(bar);
  }
}

// ── Render: freshness ─────────────────────────────────────────────────────
// The whole point of the snapshot fallback is that a NAS outage still renders a
// page — so say plainly how old the numbers are and where they came from.
function renderFreshness(generatedAt, source) {
  const genAt = new Date(generatedAt);
  const ageMs = Date.now() - genAt.getTime();
  const chip  = document.getElementById('source-chip');
  const stale = ageMs > 2 * 3600000;

  if (source === 'snapshot') {
    chip.hidden = false;
    chip.className = 'chip warn';
    chip.textContent = 'offline snapshot';
  } else if (stale) {
    chip.hidden = false;
    chip.className = 'chip warn';
    chip.textContent = 'stará data';
  } else {
    chip.hidden = true;
  }

  document.getElementById('last-updated').textContent =
    'Aktualizováno: ' + genAt.toLocaleString('cs-CZ', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  document.getElementById('footer-ts').textContent = genAt.toLocaleString('cs-CZ');

  if (source === 'snapshot' || stale) {
    const sub = document.getElementById('overall-sub');
    const why = source === 'snapshot' ? 'collector je nedostupný, zobrazen poslední známý stav' : 'data nejsou čerstvá';
    sub.textContent += ` · ${why} (${fmtAgo(genAt)})`;
  }
}

// ── Fetch ─────────────────────────────────────────────────────────────────
async function getJSON(url) {
  const res = await fetch(url, {
    cache: 'no-store',
    signal: AbortSignal.timeout(LIVE_TIMEOUT_MS),
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function loadData() {
  let liveErr = null;
  if (API_BASE) {
    try {
      // /api/comfy is newer than /api/status — a collector without it must not
      // knock the whole page over.
      const [status, comfy] = await Promise.all([
        getJSON(`${API_BASE}/api/status`),
        getJSON(`${API_BASE}/api/comfy`).catch(() => null),
      ]);
      return { status, comfy, source: 'live' };
    } catch (err) {
      liveErr = err;
    }
  }
  if (SNAPSHOT_BASE) {
    const [status, comfy] = await Promise.all([
      getJSON(`${SNAPSHOT_BASE}/status.json`),
      getJSON(`${SNAPSHOT_BASE}/comfy.json`).catch(() => null),
    ]);
    return { status, comfy, source: 'snapshot' };
  }
  throw liveErr || new Error('Není nakonfigurovaný žádný zdroj dat');
}

// Keep the last payload so a resize can re-lay-out without refetching — the
// bucket count is derived from the container width.
let lastPayload = null;

function draw() {
  if (!lastPayload) return;
  const { status, comfy, source } = lastPayload;
  const main = document.getElementById('main');
  main.innerHTML = '';
  renderStatus(status, main);
  renderComfy(comfy, main);
  renderFreshness(status.generated_at, source);
}

async function refresh() {
  try {
    lastPayload = await loadData();
    draw();
  } catch (err) {
    document.getElementById('main').innerHTML = `
      <div class="state-msg">
        <div class="big">⚠</div>
        <div>Nepodařilo se načíst data ze status API ani ze zálohy.</div>
        <div style="margin-top:8px;font-size:.7rem;color:#444">${esc(err.message)}</div>
      </div>`;
    document.getElementById('overall-label').textContent = 'Stav nedostupný';
    document.getElementById('overall-dot').className = 'status-dot';
  }
}

let resizeTimer = null;
let lastWidth = window.innerWidth;
window.addEventListener('resize', () => {
  if (window.innerWidth === lastWidth) return; // ignore mobile URL-bar scroll
  lastWidth = window.innerWidth;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(draw, 200);
});

refresh();
// Auto-refresh every 5 minutes
setInterval(refresh, 5 * 60 * 1000);
</script>
